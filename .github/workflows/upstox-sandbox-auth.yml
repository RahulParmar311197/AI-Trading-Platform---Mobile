name: Upstox Sandbox Auth Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sandbox-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify sandbox secret is configured
        env:
          UPSTOX_SANDBOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_SANDBOX_ACCESS_TOKEN }}
        run: |
          if [ -z "$UPSTOX_SANDBOX_ACCESS_TOKEN" ]; then
            echo "UPSTOX_SANDBOX_ACCESS_TOKEN is not configured in repository secrets."
            exit 1
          fi
          echo "Upstox sandbox access token is configured (value withheld)."
      - name: Verify Upstox sandbox DNS and HTTPS reachability
        run: |
          python - <<'PY'
          import socket
          import ssl
          import time
          import urllib.request
          import urllib.error

          host = "sandbox.upstox.com"
          last_error = None
          for attempt in range(1, 7):
              try:
                  addresses = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
                  if not addresses:
                      raise RuntimeError("DNS returned no addresses")
                  print(f"Resolved {host} on attempt {attempt}.")
                  break
              except (OSError, socket.gaierror) as exc:
                  last_error = exc
                  print(f"DNS resolution attempt {attempt}/6 failed: {exc}")
                  if attempt < 6:
                      time.sleep(5)
          else:
              raise RuntimeError(
                  f"GitHub runner cannot resolve {host}; Upstox authentication was not attempted."
              ) from last_error

          context = ssl.create_default_context()
          request = urllib.request.Request(
              "https://sandbox.upstox.com/",
              method="HEAD",
              headers={"User-Agent": "AI-Trading-Platform-Sandbox-Preflight/1.0"},
          )
          try:
              with urllib.request.urlopen(request, context=context, timeout=15) as response:
                  print(f"Upstox sandbox HTTPS endpoint reachable: HTTP {response.status}.")
          except urllib.error.HTTPError as exc:
              # Any HTTP response proves DNS/TLS/network reachability; authentication is
              # intentionally not attempted by this unauthenticated preflight.
              print(f"Upstox sandbox HTTPS endpoint reachable: HTTP {exc.code}.")
          except urllib.error.URLError as exc:
              raise RuntimeError(
                  "Upstox sandbox DNS resolved, but HTTPS connectivity failed."
              ) from exc
          PY
      - name: Validate sandbox SDK configuration without submitting an order
        env:
          UPSTOX_SANDBOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_SANDBOX_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import upstox_client

          token = os.environ["UPSTOX_SANDBOX_ACCESS_TOKEN"]
          if not token.strip():
              raise RuntimeError("Upstox sandbox access token is empty")

          configuration = upstox_client.Configuration(sandbox=True)
          configuration.access_token = token
          if not configuration.access_token:
              raise RuntimeError("Upstox sandbox SDK access token was not applied")

          print("Upstox sandbox SDK configuration initialized successfully; token withheld.")
          print("No sandbox order was submitted by this verification workflow.")
          PY
