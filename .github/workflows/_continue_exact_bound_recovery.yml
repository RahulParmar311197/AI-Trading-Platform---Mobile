name: _continue exact bound recovery

on:
  push:
    paths:
      - .github/continue-exact-bound-recovery.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Apply exact bound broker recovery
        shell: python
        run: |
          from pathlib import Path
          gateway = Path('backend/app/live_execution_gateway.py')
          text = gateway.read_text(encoding='utf-8')
          old = '''    def _recover_existing_submission(self, request: BrokerOrderRequest) -> BrokerOrderUpdate | None:\n        """Recover an existing unresolved intent before any new broker submission."""\n        recovered = self._recover_ambiguous_submission(request)\n        if recovered is None:\n            return None\n        return recovered\n\n    def _recover_ambiguous_submission(self, request: BrokerOrderRequest) -> BrokerOrderUpdate | None:\n        finder = getattr(self.executor, "find_order_by_client_id", None)\n        if not callable(finder):\n            return None\n        try:\n            recovered = finder(request.client_order_id)\n            if recovered is None:\n                return None\n            return normalize_broker_update(recovered, expected=request)\n        except (TypeError, ValueError, RuntimeError):\n            return None\n'''
          new = '''    def _recover_existing_submission(self, request: BrokerOrderRequest, existing_intent=None) -> BrokerOrderUpdate | None:\n        """Recover an unresolved submission using its immutable broker binding first."""\n        if existing_intent is not None and existing_intent.broker_order_id:\n            getter = getattr(self.executor, "get_order", None)\n            if not callable(getter):\n                return None\n            try:\n                recovered = getter(existing_intent.broker_order_id)\n                if recovered is None:\n                    return None\n                return normalize_broker_update(recovered, expected=request)\n            except (TypeError, ValueError, RuntimeError):\n                return None\n        return self._recover_ambiguous_submission(request)\n\n    def _recover_ambiguous_submission(self, request: BrokerOrderRequest) -> BrokerOrderUpdate | None:\n        finder = getattr(self.executor, "find_order_by_client_id", None)\n        if not callable(finder):\n            return None\n        try:\n            recovered = finder(request.client_order_id)\n            if recovered is None:\n                return None\n            return normalize_broker_update(recovered, expected=request)\n        except (TypeError, ValueError, RuntimeError):\n            return None\n'''
          if old not in text:
              raise SystemExit('expected gateway recovery block not found')
          gateway.write_text(text.replace(old, new, 1), encoding='utf-8')
          test = Path('backend/tests/test_bound_broker_order_recovery_contract.py')
          t = test.read_text(encoding='utf-8')
          t = t.replace('''    with pytest.raises(ExecutionSafetyError):\n        gw.execute_request(req, auth, context())\n\n    assert broker.get_calls == []\n    assert broker.find_calls == [req.client_order_id]\n    assert broker.submit_calls == 0\n''', '''    result = gw.execute_request(req, auth, context())\n\n    assert result.result.order_id == "broker-bound-123"\n    assert broker.get_calls == ["broker-bound-123"]\n    assert broker.find_calls == []\n    assert broker.submit_calls == 0\n    assert store.get_unresolved(req.client_order_id) is None\n''', 1)
          old_test = '''def test_bound_intent_with_contradictory_client_lookup_must_not_rebind(tmp_path):\n    req = request()\n    store = SubmissionIntentStore(tmp_path / "intents.json")\n    seed_bound_intent(store, req)\n    assert store.get_unresolved(req.client_order_id).broker_order_id == "broker-bound-123"\n'''
          new_test = '''def test_bound_intent_with_contradictory_client_lookup_must_not_rebind(tmp_path):\n    req = request()\n    store = SubmissionIntentStore(tmp_path / "intents.json")\n    seed_bound_intent(store, req)\n    broker = BoundOrderExecutor(BrokerOrderUpdate(order_id="broker-bound-123", status="FILLED", client_order_id=req.client_order_id, symbol=req.symbol, side=req.side, quantity=req.quantity, filled_quantity=1, average_price=100))\n    gw = gateway(broker, store)\n    auth = gw.authorize_request(req, context())\n    result = gw.execute_request(req, auth, context())\n    assert result.result.order_id == "broker-bound-123"\n    assert broker.get_calls == ["broker-bound-123"]\n    assert broker.find_calls == []\n    assert broker.submit_calls == 0\n    assert store.get_unresolved(req.client_order_id) is None\n'''
          if old_test in t:
              t = t.replace(old_test, new_test, 1)
          test.write_text(t, encoding='utf-8')
      - name: Verify contract
        run: pytest -q backend/tests/test_bound_broker_order_recovery_contract.py
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_continue_exact_bound_recovery.yml .github/continue-exact-bound-recovery.trigger
          git add backend/app/live_execution_gateway.py backend/tests/test_bound_broker_order_recovery_contract.py .github/workflows/_continue_exact_bound_recovery.yml .github/continue-exact-bound-recovery.trigger
          git diff --cached --quiet && exit 0
          git commit -m "fix(execution): recover bound broker orders by exact identity"
          git push
