name: Reconciliation Safety

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  recovery-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trading_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trading_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: test
      PYTHONPATH: .:..
      BROKER_CONTEXT_ATTESTATION_SECRET: ci-test-broker-context-attestation-secret-0123456789abcdef
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/trading_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/trading_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Verify migration metadata is current
        run: alembic check

      - name: Run reconciliation and risk safety tests
        run: |
          pytest -q \
            tests/test_ambiguous_submission_recovery_matrix.py \
            tests/test_startup_recovery.py \
            tests/test_risk_reservation_store.py
