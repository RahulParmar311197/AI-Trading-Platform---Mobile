name: Trading Safety

on:
  push:
  pull_request:

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile backend Python
        run: python -m compileall -q backend
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify bound broker recovery contract
        run: pytest -q backend/tests/test_bound_broker_order_recovery_contract.py
      - name: Verify market data safety contract
        run: pytest -q backend/tests/test_market_data_contract.py backend/tests/test_market_data.py
      - name: Verify technical analysis safety contract
        run: pytest -q backend/tests/test_technical_analysis.py
      - name: Verify ICT analysis safety contract
        run: pytest -q backend/tests/test_ict_engine_contract.py
      - name: Verify strategy safety contract
        run: pytest -q backend/tests/test_strategy_contract.py
      - name: Verify live execution is disabled by default
        run: |
          python - <<'PY'
          from backend.app.live_execution_adapter import LiveExecutionAdapter, LiveExecutionConfig
          adapter = LiveExecutionAdapter(config=LiveExecutionConfig())
          assert adapter.enabled is False
          try:
              adapter.submit({'symbol': 'TEST', 'quantity': 1})
          except RuntimeError:
              pass
          else:
              raise AssertionError('live execution unexpectedly enabled')
          PY
      - name: Verify idempotency guard
        run: |
          python - <<'PY'
          from backend.app.idempotent_execution import IdempotentExecution
          guard = IdempotentExecution(max_attempts=3)
          calls = {'n': 0}
          def submit():
              calls['n'] += 1
              return {'ok': True}
          first = guard.execute('ci-order-1', submit)
          second = guard.execute('ci-order-1', submit)
          assert calls['n'] == 1
          assert first.result == second.result
          PY