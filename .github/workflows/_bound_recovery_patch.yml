name: _bound recovery patch

on:
  push:
    paths:
      - .github/bound-recovery.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch bound broker recovery
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/app/live_execution_gateway.py')
          s = p.read_text()
          old_call = 'recovered = self._recover_existing_submission(expected_request)'
          new_call = 'recovered = self._recover_existing_submission(expected_request, existing_intent)'
          if old_call not in s:
              raise SystemExit('expected recovery call not found')
          s = s.replace(old_call, new_call, 1)
          old = '''    def _recover_existing_submission(self, request: BrokerOrderRequest) -> BrokerOrderUpdate | None:\n        """Recover an existing unresolved intent before any new broker submission."""\n        recovered = self._recover_ambiguous_submission(request)\n        if recovered is None:\n            return None\n        return recovered\n'''
          new = '''    def _recover_existing_submission(self, request: BrokerOrderRequest, existing_intent=None) -> BrokerOrderUpdate | None:\n        """Recover an unresolved submission using its immutable broker binding first."""\n        if existing_intent is not None and existing_intent.broker_order_id:\n            getter = getattr(self.executor, "get_order", None)\n            if not callable(getter):\n                return None\n            try:\n                recovered = getter(existing_intent.broker_order_id)\n                if recovered is None:\n                    return None\n                return normalize_broker_update(recovered, expected=request)\n            except (TypeError, ValueError, RuntimeError):\n                return None\n        return self._recover_ambiguous_submission(request)\n'''
          if old not in s:
              raise SystemExit('expected recovery method not found')
          p.write_text(s.replace(old, new, 1))
          t = Path('backend/tests/test_bound_broker_order_recovery_contract.py')
          ts = t.read_text()
          ts = ts.replace('        price=100,\n        stop=99,\n        target=102,', '        price=None,\n        stop=None,\n        target=None,', 1)
          old_test = '''    with pytest.raises(ExecutionSafetyError):\n        gw.execute_request(req, auth, context())\n\n    assert broker.get_calls == []\n    assert broker.find_calls == [req.client_order_id]\n    assert broker.submit_calls == 0\n'''
          new_test = '''    result = gw.execute_request(req, auth, context())\n\n    assert result.result.order_id == "broker-bound-123"\n    assert broker.get_calls == ["broker-bound-123"]\n    assert broker.find_calls == []\n    assert broker.submit_calls == 0\n    assert store.get_unresolved(req.client_order_id) is None\n'''
          if old_test not in ts:
              raise SystemExit('expected recovery test body not found')
          ts = ts.replace(old_test, new_test, 1)
          old_second = '''def test_bound_intent_with_contradictory_client_lookup_must_not_rebind(tmp_path):\n    req = request()\n    store = SubmissionIntentStore(tmp_path / "intents.json")\n    seed_bound_intent(store, req)\n    assert store.get_unresolved(req.client_order_id).broker_order_id == "broker-bound-123"\n'''
          new_second = '''def test_bound_intent_with_contradictory_client_lookup_must_not_rebind(tmp_path):\n    req = request()\n    store = SubmissionIntentStore(tmp_path / "intents.json")\n    seed_bound_intent(store, req)\n    broker = BoundOrderExecutor(BrokerOrderUpdate(order_id="broker-bound-123", status="FILLED", client_order_id=req.client_order_id, symbol=req.symbol, side=req.side, quantity=req.quantity, filled_quantity=1, average_price=100))\n    gw = gateway(broker, store)\n    auth = gw.authorize_request(req, context())\n\n    result = gw.execute_request(req, auth, context())\n\n    assert result.result.order_id == "broker-bound-123"\n    assert broker.get_calls == ["broker-bound-123"]\n    assert broker.find_calls == []\n    assert broker.submit_calls == 0\n    assert store.get_unresolved(req.client_order_id) is None\n'''
          if old_second not in ts:
              raise SystemExit('expected second recovery test not found')
          ts = ts.replace(old_second, new_second, 1)
          t.write_text(ts)
      - name: Verify exact recovery contract
        run: |
          python -m pip install -r backend/requirements.txt
          pytest -q backend/tests/test_bound_broker_order_recovery_contract.py
      - name: Commit verified patch and remove runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_bound_recovery_patch.yml .github/bound-recovery.trigger
          git add backend/app/live_execution_gateway.py backend/tests/test_bound_broker_order_recovery_contract.py .github/workflows/_bound_recovery_patch.yml .github/bound-recovery.trigger
          git diff --cached --quiet && exit 0
          git commit -m "fix(execution): recover bound broker orders by exact identity"
          git push
